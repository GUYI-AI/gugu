<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- @@@no-page-zoom (#569) - this is an app, not a document: native pinch-zoom would scale the whole
         page (incl. the chat message area), which users can't recover from. Disable it so pinch never
         shrinks the message list. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" href="/assets/app/gugu-icon-small.png" />
    <title>咕咕</title>
    <!-- @@@engine-floor - an engine below ENGINE_FLOOR (scripts/build/engine-floor.mts) stops here, before any stylesheet or
         module loads, and gets one plain page saying what to update. Above it, the build supplies what the engine lacks
         (sRGB color fallbacks, polyfills); below it the layout itself is missing (Tailwind's styles live in @layer). The probe
         is the floor API's `probe` (pinned by tests/unit/desktop/engineFloorGate.test.ts). Colors below are sRGB on
         purpose. On Android the native splash waits for a content frame, so this page reports one through the startup
         plugin (androidStartupHandoff.ts). -->
    <script>
      (function() {
        if (window.CSSLayerBlockRule) return;
        // Everything after this point, the bundle's module and stylesheet tags included, parses as inert hidden text.
        // (window.stop() would also prevent loading, but it aborts before <body> and Chromium then never paints.)
        document.write('<plaintext hidden>');
        document.addEventListener('DOMContentLoaded', show);
        function show() {
          var cap = window.Capacitor;
          var android = !!(cap && cap.getPlatform && cap.getPlatform() === 'android');
          var zh = /^zh/i.test(navigator.language || '');
          var text = zh
            ? (android
              ? ['需要更新 Android System WebView', '手机上的 Android System WebView 版本太旧，咕咕无法正常显示。请在应用商店更新“Android System WebView”（有的手机是“Chrome”），然后完全退出咕咕再重新打开。', '去应用商店更新']
              : ['需要更新浏览器', '当前系统或浏览器版本太旧，咕咕无法正常显示。请更新到最新版本后重新打开。'])
            : (android
              ? ['Update Android System WebView', 'Android System WebView on this phone is too old to display Gugu. Update “Android System WebView” (on some phones, “Chrome”) in your app store, then fully close and reopen Gugu.', 'Open app store']
              : ['Update your browser', 'This system or browser is too old to display Gugu. Update it to the latest version, then reopen Gugu.']);
          var root = document.documentElement;
          root.lang = zh ? 'zh-CN' : 'en';
          var body = document.body;
          body.setAttribute('style', 'margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 28px;box-sizing:border-box;background:#fff;color:#0a0a0a;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif');
          var box = body.appendChild(document.createElement('div'));
          box.setAttribute('style', 'max-width:360px');
          var title = box.appendChild(document.createElement('h1'));
          title.setAttribute('style', 'margin:0 0 12px;font-size:20px;line-height:28px;font-weight:600');
          title.textContent = text[0];
          var note = box.appendChild(document.createElement('p'));
          note.setAttribute('style', 'margin:0;color:#4b4c4e');
          note.textContent = text[1];
          if (android) {
            var link = box.appendChild(document.createElement('a'));
            link.href = 'https://play.google.com/store/apps/details?id=com.google.android.webview';
            link.setAttribute('style', 'display:block;margin-top:24px;padding:12px 16px;border-radius:12px;background:#3b82f6;color:#fff;text-align:center;text-decoration:none;font-weight:600');
            link.textContent = text[2];
            cap.nativePromise('GuguShellChrome', 'startupContext', {}).then(function(context) {
              if (context && context.enabled)
                return cap.nativePromise('GuguShellChrome', 'startupContentReady', { attemptId: context.attemptId });
            });
          }
        }
      })();
    </script>
    <style>
      html, body { margin: 0; }
      [data-gugu-boot] { position: fixed; inset: 0; z-index: 100; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; overflow: hidden; pointer-events: none; background: #fff; color: #0a0a0a; }
      [data-theme="dark"] [data-gugu-boot] { background: #0f0f0f; color: #f0f0f2; }
      [data-gugu-boot] > svg { position: absolute; width: min(355.2px, calc(100vw - 48px)); height: auto; }
      [data-gugu-boot] [data-startup-poster-settled] { display: none; }
      [data-gugu-boot] > iframe { width: 640px; max-width: none; height: 100vh; border: 0; transform: scale(.6); opacity: 0; }
      [data-startup-slogan] { position: absolute; inset-inline: 24px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); margin: 0; color: var(--muted-fg, #68696b); font-family: var(--font-family-system, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif); font-size: 12px; line-height: 18px; text-align: center; text-wrap: balance; }
      [data-theme="dark"] [data-startup-slogan] { color: var(--muted-fg, #a1a1a1); }
      @media (prefers-reduced-motion: reduce) {
        [data-gugu-boot] [data-startup-poster-enter] { display: none; }
        [data-gugu-boot] [data-startup-poster-settled] { display: inline; }
      }
    </style>
    <!-- @@@5293 首帧之前把偏好解析成真值,避免闪一下再改。偏好从这个壳自己的那一份读(@@@device-preferences,
         shared/device-preferences.ts):桌面 = preload 交来的主进程首帧答复(guguFirstFrame;主进程没答上来就是出厂值),
         web / 手机 = localStorage。❌ 桌面读不到再去读 localStorage。规则与 `host-theme.ts` 逐字一致:
         存的是**偏好**(light / dark / system),明暗真值仍是 light / dark;旧 plain-white 按浅色处理。
         认不出来的值退回浅色(@@@1424 的默认),❌ 不猜 —— 「跟随系统」只有在用户显式选了 system 时才成立。
         侧栏渐进底色(@@@sidebar-tint)同理:开着时首帧之前就落上属性,否则会先闪一下未染色的侧栏;
         只有存下来的字面量是 'true' 才算开。 -->
    <script>
      (function() {
        var desktop = window.guguFirstFrame;
        var stored = desktop ? null : localStorage;
        var prefs = desktop ? desktop.devicePreferences : null;
        var pref = prefs ? prefs.theme : stored ? stored.getItem('app-theme') : 'light';
        if (pref === 'plain-white') pref = 'light';
        if (pref !== 'light' && pref !== 'dark' && pref !== 'system') pref = 'light';
        var resolved = pref === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : pref;
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.setAttribute('data-theme-preference', pref);
        if (prefs ? prefs.sidebarTint : stored && stored.getItem('gugu.sidebar-tint') === 'true') {
          document.documentElement.setAttribute('data-sidebar-tint', 'on');
        }
      })();
    </script>
    <!-- @@@theme-pack-slots 资源库「主题」选过的配色:首帧之前插上,❌ 先闪咕咕默认色再换。
         样式表是选主题时算好存下的(`src/session/renderer/lib/theme/theme-pack-store.ts`,key 与 style id 逐字一致);
         这里只原样插,不解析、不计算。 -->
    <script>
      (function() {
        var css = localStorage.getItem('app-theme-pack-css');
        if (!css) return;
        var style = document.createElement('style');
        style.id = 'gugu-theme-pack';
        style.textContent = css;
        document.head.appendChild(style);
      })();
    </script>
  </head>
  <body>
    <div data-gugu-boot aria-hidden="true"><!--gugu-startup-poster--></div>
    <div id="root"></div>
    <!-- @@@root-stays-put: portals append to <body>. With this fixed sibling #root is never :last-child or :only-child, so opening any portal cannot restyle the whole app. -->
    <div data-root-sibling hidden></div>
    <script type="module" src="/src/lib/engine-polyfills.ts"></script>
    <script type="module" src="/src/lib/startup-motion-bootstrap.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
