<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- @@@no-page-zoom (#569) - this is an app, not a document: native pinch-zoom would scale the whole
         page (incl. the chat message area), which users can't recover from. Disable it so pinch never
         shrinks the message list. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" href="/assets/app/gugu-icon-small.png" />
    <title>咕咕</title>
    <style>
      html, body { margin: 0; }
      [data-gugu-boot] { position: fixed; inset: 0; z-index: 100; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; overflow: hidden; pointer-events: none; background: #fff; color: #0a0a0a; }
      [data-theme="dark"] [data-gugu-boot] { background: #0f0f0f; color: #f0f0f2; }
      [data-gugu-boot] > svg { position: absolute; width: min(355.2px, calc(100vw - 48px)); height: auto; }
      [data-gugu-boot] [data-startup-poster-settled] { display: none; }
      [data-gugu-boot] > iframe { width: 640px; max-width: none; height: 100vh; border: 0; transform: scale(.6); opacity: 0; }
      [data-startup-slogan] { position: absolute; inset-inline: 24px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); margin: 0; color: var(--muted-fg, #68696b); font-family: var(--font-family-system, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif); font-size: 12px; line-height: 18px; text-align: center; text-wrap: balance; }
      [data-theme="dark"] [data-startup-slogan] { color: var(--muted-fg, #a1a1a1); }
      @media (prefers-reduced-motion: reduce) {
        [data-gugu-boot] [data-startup-poster-enter] { display: none; }
        [data-gugu-boot] [data-startup-poster-settled] { display: inline; }
      }
    </style>
    <!-- @@@device-preferences 首帧之前把这台设备的偏好落到文档上:主题、主题包样式表、侧栏着色(避免闪一下再改)。
         一个壳一份存储,与 `src/lib/devicePreferences.ts` 同一个选择(规则见 `shared/device-preferences.ts`):
         桌面 = preload 交出的 `window.guguDeviceSettings`(主进程的设置;它也是设置读模型的首个值);
         web / 手机 = localStorage(它们唯一的设备存储)。❌ 先读一份、读不到再读另一份。
         @@@5293 存的是**偏好**(light / dark / system),明暗真值仍是 light / dark;旧 plain-white 按浅色处理,
         data-theme-preference 同步归一。认不出来的值退回浅色(@@@1424 的默认),❌ 不猜、也❌ 在这里跟随系统——
         「跟随系统」只有在用户显式选了 system 时才成立。
         @@@theme-pack-slots 主题包样式表:桌面由主进程按槽位算好交过来,web / 手机是页里算好存下的那一段(key 与 style id
         与 `src/session/renderer/lib/theme/theme-pack-store.ts` 逐字一致);这里只原样插,不解析、不计算。
         @@@sidebar-tint 只有开着(桌面 true、web 存的字面量 'true')才落属性。 -->
    <script>
      (function() {
        var device = window.guguDeviceSettings;
        var pref, css, tint;
        if (device) {
          var handover = device.handover;
          pref = handover ? handover.settings.theme.value : null;
          css = handover ? handover.themePackCss : '';
          tint = handover ? handover.settings['interface'].value.sidebarTint === true : false;
        } else {
          pref = localStorage.getItem('app-theme');
          css = localStorage.getItem('app-theme-pack-css');
          tint = localStorage.getItem('gugu.sidebar-tint') === 'true';
        }
        if (pref === 'plain-white') pref = 'light';
        if (pref !== 'light' && pref !== 'dark' && pref !== 'system') pref = 'light';
        var resolved = pref === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : pref;
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.setAttribute('data-theme-preference', pref);
        if (css) {
          var style = document.createElement('style');
          style.id = 'gugu-theme-pack';
          style.textContent = css;
          document.head.appendChild(style);
        }
        if (tint) document.documentElement.setAttribute('data-sidebar-tint', 'on');
      })();
    </script>
  </head>
  <body>
    <div data-gugu-boot aria-hidden="true"><!--gugu-startup-poster--></div>
    <div id="root"></div>
    <!-- @@@root-stays-put: portals append to <body>. With this fixed sibling #root is never :last-child or :only-child, so opening any portal cannot restyle the whole app. -->
    <div data-root-sibling hidden></div>
    <script type="module" src="/src/lib/startup-motion-bootstrap.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
