// Top-level build file where you can add configuration options common to all sub-projects/modules.

// Repositories for every project, this one included, are set in settings.gradle.
buildscript {
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// #3208: Capacitor regenerates the Cordova library without a Kotlin plugin.
// Its standalone instrumented-test runtime can otherwise mix stdlib 1.8.22
// with the pre-merge jdk7/jdk8 1.6.21 jars. Keep this in the tracked root so
// cap sync preserves alignment, and leave duplicate-class checks enabled.
project(':capacitor-cordova-android-plugins') { cordovaProject ->
    cordovaProject.pluginManager.withPlugin('com.android.library') {
        cordovaProject.dependencies.add(
            'androidTestImplementation',
            cordovaProject.dependencies.platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
        )
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
